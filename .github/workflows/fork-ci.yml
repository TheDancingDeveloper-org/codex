# Fork-only CI. The upstream blocking-ci, CLA and v8-canary workflows are
# disabled on this fork, so this is the check that runs on fork pull requests.
# New file with a fork-unique name; no upstream workflow is edited.
name: fork-ci

on:
  pull_request:
    branches: [fork/main]
  # The merge queue (WI-1886, docs/ci.md). The queue tests the tree fork/main
  # will become, so a PR never has to be rebased onto a sibling's merge.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      # Comma-separated package names to check instead of the diff. Used to
      # measure the baseline on unmodified fork/main, which has no diff.
      packages:
        description: Packages to check, overriding the diff
        required: false
        default: ""

permissions:
  contents: read

# A force-push cancels the superseded run. Each queue entry has its own
# gh-readonly-queue/... ref, so queue entries never cancel each other.
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset requires one check, `fmt, clippy, test` (the last job below).
  # The work runs as parallel jobs under other names, and that job reports
  # their combined result, so the required context never changes. Splitting
  # took the merge_group run from 95-105 minutes (one serial job, past the
  # queue's 90-minute timeout) to the length of its longest half (WI-4161).
  plan:
    name: plan
    # Trusted runs (same-repo PRs, workflow_dispatch) use the GCP Spot runner
    # (30 vCPU, persistent sccache; started on demand by the Node B poller).
    # Fork PRs stay on GitHub-hosted runners: a persistent self-hosted runner
    # must never execute untrusted fork code.
    # Temporarily pinned to node-f (WI-4100): ci-k8s-1's 98 GB scratch volume is too small for a Codex workspace build (ENOSPC). Remove the node-f label once the k8s runners have enough scratch.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","rust-heavy","node-f"]') }}
    defaults:
      run:
        working-directory: codex-rs
    outputs:
      rust: ${{ steps.crates.outputs.rust }}
      list: ${{ steps.crates.outputs.list }}
      all: ${{ steps.crates.outputs.all }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # fork/main sits on an upstream release tag, whose release commit bumps
      # the workspace version from 0.0.0 to the tag (Cargo.lock keeps 0.0.0).
      # Upstream runs its tests at 0.0.0 and never on the tag commit, so its
      # snapshots render "v0.0.0" and its daemon tests rely on 0.0.0 counting
      # as a dev build. Test at 0.0.0 the same way. fork-release stamps the
      # real version separately, so releases are unaffected.
      - name: Test at upstream's development version
        run: |
          sed -i '/^\[workspace.package\]$/,/^\[/ s/^version = ".*"$/version = "0.0.0"/' Cargo.toml
          grep -A1 '^\[workspace.package\]$' Cargo.toml | grep -qx 'version = "0.0.0"' \
            || { echo "workspace version reset did not land" >&2; exit 1; }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      # Directory names are not package names (app-server-protocol is the
      # package codex-app-server-protocol) and crates nest (codex-rs/ext/skills),
      # so each changed file maps to the package whose manifest directory is
      # the longest prefix of its path. A workspace manifest change rebuilds
      # every package.
      - name: Packages changed against fork/main
        id: crates
        env:
          FORCED_PACKAGES: ${{ inputs.packages }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # In the queue, diff the whole group against the queue's base: every
          # PR ahead of this one in the group is part of the tree under test.
          if [[ -n "$QUEUE_BASE" ]]; then
            base="$QUEUE_BASE"
          else
            base="$(git merge-base HEAD origin/fork/main 2>/dev/null || git merge-base HEAD fork/main)"
          fi
          mapfile -t files < <(git diff --name-only "$base"...HEAD)
          # Path scope: a diff with nothing under codex-rs/ or .github/ (docs,
          # FORK.md, sdk/) skips the Rust steps. The job still reports, so a
          # required check is satisfied.
          rust=false
          for f in "${files[@]}"; do
            case "$f" in codex-rs/*|.github/*) rust=true ;; esac
          done
          [[ -n "$FORCED_PACKAGES" ]] && rust=true
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          if [[ -n "$FORCED_PACKAGES" ]]; then
            mapfile -t packages < <(echo "$FORCED_PACKAGES" | tr ',' '\n')
            echo "forced: ${packages[*]}"
            {
              echo "list<<EOF"
              printf '%s\n' "${packages[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          all=false
          lock_only=false
          for f in "${files[@]}"; do
            case "$f" in
              codex-rs/Cargo.toml) all=true ;;
              codex-rs/Cargo.lock) lock_only=true ;;
            esac
          done
          # A workspace manifest change rebuilds every package. A Cargo.lock
          # change does not: only members whose resolved dependency set
          # actually moved are selected, by diffing `cargo metadata` (the full
          # resolve, not --no-deps) on the base against HEAD. Any other path
          # still selects its owning package, and a member manifest also
          # selects its workspace reverse-dependencies.
          others=()
          for f in "${files[@]}"; do
            [[ "$f" == "codex-rs/Cargo.lock" ]] && continue
            others+=("$f")
          done
          if $all; then
            mapfile -t packages < <(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].name' | sort -u)
          else
            mapfile -t packages < <(cargo metadata --no-deps --format-version 1 \
              | python3 "${GITHUB_WORKSPACE}/.github/scripts/fork-changed-packages.py" "${others[@]}")
            if $lock_only; then
              base_meta="$(mktemp)"
              head_meta="$(mktemp)"
              cargo metadata --format-version 1 --locked > "$head_meta"
              # metadata reads the lock next to the workspace manifest. Swap the
              # base lock in, read it, and put HEAD's lock back. The manifest
              # stays HEAD's: a manifest change is not lock-only.
              cp Cargo.lock /tmp/Cargo.lock.head
              # A failed metadata read must not leave the base lock checked out:
              # every later cargo invocation would compile against it.
              trap 'mv /tmp/Cargo.lock.head Cargo.lock' EXIT
              git show "$base:codex-rs/Cargo.lock" > Cargo.lock
              # Not --locked. The base lock describes the base manifests, and
              # reading it against HEAD's manifests (a new edge on an existing
              # package) makes cargo 1.95 call the lock stale even though the
              # resolve is identical. --offline keeps it from moving a version;
              # the copy above is discarded either way.
              cargo metadata --format-version 1 --offline > "$base_meta"
              mv /tmp/Cargo.lock.head Cargo.lock
              trap - EXIT
              mapfile -t locked < <(python3 "${GITHUB_WORKSPACE}/.github/scripts/fork-lock-affected.py" "$base_meta" "$head_meta")
              if (( ${#locked[@]} == 0 )); then
                # A lock that "affects nothing" is a bug in the diff far more
                # often than a fact, and skipping every check would fail open.
                echo "::warning::Cargo.lock changed but the resolve diff selected nothing; selecting every member"
                mapfile -t locked < <(jq -r --argjson members "$(jq -c '.workspace_members' "$head_meta")" \
                  '.packages[] | select(.id as $id | $members | index($id)) | .name' "$head_meta" | sort -u)
              fi
              packages+=("${locked[@]}")
            fi
          fi
          # Unique, stable order.
          mapfile -t packages < <(printf '%s\n' "${packages[@]}" | awk 'NF && !seen[$0]++')
          # codex-voice-host is the only package that pulls in GStreamer, and it
          # needs gstreamer-1.0 >= 1.28 while Ubuntu 24.04 ships 1.24, so no apt
          # package satisfies it. Every other Rust step excludes it; drop it here
          # as well, or nextest builds it through its -p list and the whole job
          # fails on glib-2.0.pc.
          mapfile -t packages < <(printf '%s\n' "${packages[@]}" | awk '$0 != "codex-voice-host"')
          echo "changed: ${packages[*]:-none}"
          # Whether the selection is every workspace member clippy can build.
          # Then clippy --all-targets compiles exactly what `cargo check
          # --workspace --all-targets` would, and lint skips the separate check.
          mapfile -t members < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name' | awk '$0 != "codex-voice-host"' | sort -u)
          if [[ "$(printf '%s\n' "${members[@]}" | sort -u)" == "$(printf '%s\n' "${packages[@]:-}" | sed '/^$/d' | sort -u)" ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "list<<EOF"
            printf '%s\n' "${packages[@]:-}"
            echo "EOF"
            echo "files<<EOF"
            printf '%s\n' "${files[@]:-}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: fmt, clippy
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","rust-heavy","node-f"]') }}
    # The workspace Cargo.toml is codex-rs/Cargo.toml; the repo root has none.
    defaults:
      run:
        working-directory: codex-rs
    env:
      # CI-scoped build settings from the cargo build-performance guide.
      # Job env only: upstream's profiles in Cargo.toml stay untouched.
      # line-tables-only keeps file/line in backtraces (tests do read them)
      # while dropping variable debuginfo, which dominates codegen and linking.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # CI builds once per crate version; incremental caches never pay back.
      CARGO_INCREMENTAL: "0"
      # No RUSTFLAGS. Stable rustc 1.95 on x86_64-unknown-linux-gnu already
      # links with its bundled rust-lld (the self-contained linker, shipped in
      # the sysroot since 1.90). -fuse-ld=lld would need a system lld and a
      # different linker, and nightly-only options (-Zthreads, cranelift) are
      # out: this job pins stable.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # fork/main sits on an upstream release tag, whose release commit bumps
      # the workspace version from 0.0.0 to the tag (Cargo.lock keeps 0.0.0).
      # Upstream runs its tests at 0.0.0 and never on the tag commit, so its
      # snapshots render "v0.0.0" and its daemon tests rely on 0.0.0 counting
      # as a dev build. Test at 0.0.0 the same way. fork-release stamps the
      # real version separately, so releases are unaffected.
      - name: Test at upstream's development version
        run: |
          sed -i '/^\[workspace.package\]$/,/^\[/ s/^version = ".*"$/version = "0.0.0"/' Cargo.toml
          grep -A1 '^\[workspace.package\]$' Cargo.toml | grep -qx 'version = "0.0.0"' \
            || { echo "workspace version reset did not land" >&2; exit 1; }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      # linux-sandbox's build.rs links libcap through pkg-config. bubblewrap is
      # what the sandbox tests actually run.
      # The rust-heavy runner preinstalls these at boot; jobs there have no sudo.
      - name: Install build libraries
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config libasound2-dev bubblewrap

      # Ubuntu 24.04's AppArmor user-namespace restriction blocks bwrap, so
      # every sandbox test fails without this. Copied from
      # .github/actions/setup-ci/action.yml, which upstream's Linux nextest
      # jobs run before testing.
      # rust-heavy applies these sysctls at boot (/etc/sysctl.d/60-gha-userns.conf).
      - name: Allow unprivileged user namespaces
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # v8's build.rs otherwise downloads librusty_v8 from denoland, which does
      # not publish the ptrcomp_sandbox profile this tree expects. This fetches
      # the Codex-built artifacts from the upstream release and verifies them
      # against the in-tree checksum manifest, the same as fork-release.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      # codex-voice-host is excluded: it is the only package pulling in GStreamer,
      # and it requires gstreamer-1.0 >= 1.28. Ubuntu 24.04 ships 1.24, so no
      # apt package satisfies it. Upstream never builds it with cargo either; it
      # builds //codex-rs/voice-host with Bazel against a bundled GStreamer.
      # Skipped when the selection is every member: clippy below then compiles
      # the same targets, and fails on every rustc error itself.
      - name: cargo check
        if: needs.plan.outputs.all != 'true'
        shell: bash
        run: cargo check --workspace --all-targets --exclude codex-voice-host --jobs "$("${GITHUB_WORKSPACE}/.github/scripts/fork-ci-build-jobs.sh")"

      - name: cargo fmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t crates < <(printf '%s\n' "${{ needs.plan.outputs.list }}" | sed '/^$/d')
          (( ${#crates[@]} )) || exit 0
          args=()
          for crate in "${crates[@]}"; do args+=(-p "$crate"); done
          cargo fmt "${args[@]}" -- --check

      # -D warnings would fail the PR on upstream lint debt in lines it never
      # touched, and a fork patch must not have to fix that. Clippy runs without
      # it, and only a warning or error whose primary span overlaps a hunk this
      # PR changed fails the build. Compile errors are fatal regardless: this
      # step fails on any rustc error, and `cargo check` above also runs when
      # the selection is not the whole workspace.
      - name: cargo clippy
        shell: bash
        env:
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          base="${QUEUE_BASE:-$(git merge-base HEAD origin/fork/main 2>/dev/null || git merge-base HEAD fork/main)}"
          # One changed line range per hunk, as "file start count" with the
          # codex-rs/ prefix stripped. A count of 0 is a pure deletion.
          git diff -U0 "$base"...HEAD -- codex-rs \
            | awk '/^diff --git/{file=$4; sub(/^b\/codex-rs\//, "", file)}
                   /^@@/{split($3,a,","); sub(/^\+/, "", a[1]); print file, a[1], (a[2] == "" ? 1 : a[2])}' \
            > /tmp/changed-lines
          mapfile -t crates < <(printf '%s\n' "${{ needs.plan.outputs.list }}" | sed '/^$/d')
          (( ${#crates[@]} )) || exit 0
          args=()
          for crate in "${crates[@]}"; do args+=(-p "$crate"); done
          # One invocation for every selected package. Per-crate loops re-resolve
          # features and rebuild shared dependencies once per crate; cargo shares
          # that work when the packages are passed together. --timings writes
          # cargo-timing.html, which the next cargo step overwrites, so copy it
          # aside immediately.
          mkdir -p /tmp/cargo-timings
          clippy_status=0
          # Width from the runner's cores and memory limit: a whole-workspace
          # --all-targets clippy at full width was OOMKilled at an 11 GiB limit
          # (WI-3954). See fork-ci-build-jobs.sh.
          jobs="$("${GITHUB_WORKSPACE}/.github/scripts/fork-ci-build-jobs.sh")"
          cargo clippy "${args[@]}" --all-targets --jobs "$jobs" --timings --message-format=json -- -W clippy::all \
            > /tmp/clippy.json || clippy_status=$?
          [[ -f cargo-timing.html ]] && cp cargo-timing.html /tmp/cargo-timings/clippy-timing.html
          # Compile errors are fatal anywhere, as `cargo check` makes them (it is
          # skipped when this run covers every member). Only clippy's own lints
          # are gated by changed hunk.
          rustc_errors="$(jq -r '
            select(.reason == "compiler-message")
            | .message
            | select(.level == "error")
            | select(((.code.code // "") | startswith("clippy::")) | not)
            | .rendered' /tmp/clippy.json)"
          if [[ -n "$rustc_errors" ]]; then
            echo "$rustc_errors"
            echo "compile errors" >&2
            exit 1
          fi
          # A failed build with no error diagnostic at all (a build script or
          # the linker failed) is fatal too; a failure that is only clippy's
          # own deny-level lints falls through to the hunk gate below.
          if (( clippy_status != 0 )) && ! jq -e 'select(.reason == "compiler-message" and .message.level == "error")' /tmp/clippy.json >/dev/null; then
            echo "cargo clippy failed (exit $clippy_status) without a compiler diagnostic" >&2
            exit 1
          fi
          # The gate is by changed hunk, so it reads the whole stream once.
          # Splitting per crate first drops every lint from a crate whose
          # package id omits the name (cargo does that when the name equals the
          # directory's last segment: codex-home, codex-api, ...).
          rm -f /tmp/jq-err
          offenders="$(jq -r --slurpfile lines <(jq -R 'split(" ") | {file:.[0], start:.[1]|tonumber, count:.[2]|tonumber}' /tmp/changed-lines) '
            select(.reason == "compiler-message")
            | .message
            | select(.level == "warning" or .level == "error")
            | . as $m
            | ($m.spans[] | select(.is_primary)) as $s
            | select(any($lines[];
                .file == $s.file_name
                and .count > 0
                and $s.line_start <= (.start + .count - 1)
                and $s.line_end >= .start))
            | "\($s.file_name):\($s.line_start):\($s.column_start): \($m.level): \($m.message)"
          ' /tmp/clippy.json 2>/tmp/jq-err)"
          if [[ -s /tmp/jq-err ]]; then
            cat /tmp/jq-err >&2
            echo "jq failed to read the clippy output" >&2
            exit 1
          fi
          if [[ -n "$offenders" ]]; then
            echo "$offenders"
            echo "clippy findings in lines this PR changes" >&2
            exit 1
          fi

      # Uploaded even when the job failed: the report is most useful then.
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cargo-timings-lint
          path: /tmp/cargo-timings/
          if-no-files-found: ignore

  test:
    name: test
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","rust-heavy","node-f"]') }}
    # The workspace Cargo.toml is codex-rs/Cargo.toml; the repo root has none.
    defaults:
      run:
        working-directory: codex-rs
    env:
      # CI-scoped build settings from the cargo build-performance guide.
      # Job env only: upstream's profiles in Cargo.toml stay untouched.
      # line-tables-only keeps file/line in backtraces (tests do read them)
      # while dropping variable debuginfo, which dominates codegen and linking.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # CI builds once per crate version; incremental caches never pay back.
      CARGO_INCREMENTAL: "0"
      # No RUSTFLAGS. Stable rustc 1.95 on x86_64-unknown-linux-gnu already
      # links with its bundled rust-lld (the self-contained linker, shipped in
      # the sysroot since 1.90). -fuse-ld=lld would need a system lld and a
      # different linker, and nightly-only options (-Zthreads, cranelift) are
      # out: this job pins stable.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # fork/main sits on an upstream release tag, whose release commit bumps
      # the workspace version from 0.0.0 to the tag (Cargo.lock keeps 0.0.0).
      # Upstream runs its tests at 0.0.0 and never on the tag commit, so its
      # snapshots render "v0.0.0" and its daemon tests rely on 0.0.0 counting
      # as a dev build. Test at 0.0.0 the same way. fork-release stamps the
      # real version separately, so releases are unaffected.
      - name: Test at upstream's development version
        run: |
          sed -i '/^\[workspace.package\]$/,/^\[/ s/^version = ".*"$/version = "0.0.0"/' Cargo.toml
          grep -A1 '^\[workspace.package\]$' Cargo.toml | grep -qx 'version = "0.0.0"' \
            || { echo "workspace version reset did not land" >&2; exit 1; }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      # Same pin upstream uses in rust-ci-full-nextest-platform.yml, so
      # codex-rs/.config/nextest.toml (serialized test groups, retries, slow
      # timeouts) applies to the fork's tests too.
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      # linux-sandbox's build.rs links libcap through pkg-config. bubblewrap is
      # what the sandbox tests actually run.
      # The rust-heavy runner preinstalls these at boot; jobs there have no sudo.
      - name: Install build libraries
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config libasound2-dev bubblewrap

      # Ubuntu 24.04's AppArmor user-namespace restriction blocks bwrap, so
      # every sandbox test fails without this. Copied from
      # .github/actions/setup-ci/action.yml, which upstream's Linux nextest
      # jobs run before testing.
      # rust-heavy applies these sysctls at boot (/etc/sysctl.d/60-gha-userns.conf).
      - name: Allow unprivileged user namespaces
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # v8's build.rs otherwise downloads librusty_v8 from denoland, which does
      # not publish the ptrcomp_sandbox profile this tree expects. This fetches
      # the Codex-built artifacts from the upstream release and verifies them
      # against the in-tree checksum manifest, the same as fork-release.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      # codex-core's tests overflow the default thread stack (fatal runtime
      # error: stack overflow). Upstream sets the same 8 MiB floor on its
      # test step in rust-ci.yml.
      - name: cargo nextest (all but app-server integration)
        shell: bash
        env:
          RUST_MIN_STACK: "8388608"
          PACKAGES: ${{ needs.plan.outputs.list }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/fork-ci-nextest.sh" rest

      # Uploaded even when the job failed: the report is most useful then.
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cargo-timings-test
          path: /tmp/cargo-timings/
          if-no-files-found: ignore

  test-app-server:
    name: test (app-server integration)
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","rust-heavy","node-f"]') }}
    # The workspace Cargo.toml is codex-rs/Cargo.toml; the repo root has none.
    defaults:
      run:
        working-directory: codex-rs
    env:
      # CI-scoped build settings from the cargo build-performance guide.
      # Job env only: upstream's profiles in Cargo.toml stay untouched.
      # line-tables-only keeps file/line in backtraces (tests do read them)
      # while dropping variable debuginfo, which dominates codegen and linking.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # CI builds once per crate version; incremental caches never pay back.
      CARGO_INCREMENTAL: "0"
      # No RUSTFLAGS. Stable rustc 1.95 on x86_64-unknown-linux-gnu already
      # links with its bundled rust-lld (the self-contained linker, shipped in
      # the sysroot since 1.90). -fuse-ld=lld would need a system lld and a
      # different linker, and nightly-only options (-Zthreads, cranelift) are
      # out: this job pins stable.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # fork/main sits on an upstream release tag, whose release commit bumps
      # the workspace version from 0.0.0 to the tag (Cargo.lock keeps 0.0.0).
      # Upstream runs its tests at 0.0.0 and never on the tag commit, so its
      # snapshots render "v0.0.0" and its daemon tests rely on 0.0.0 counting
      # as a dev build. Test at 0.0.0 the same way. fork-release stamps the
      # real version separately, so releases are unaffected.
      - name: Test at upstream's development version
        run: |
          sed -i '/^\[workspace.package\]$/,/^\[/ s/^version = ".*"$/version = "0.0.0"/' Cargo.toml
          grep -A1 '^\[workspace.package\]$' Cargo.toml | grep -qx 'version = "0.0.0"' \
            || { echo "workspace version reset did not land" >&2; exit 1; }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      # Same pin upstream uses in rust-ci-full-nextest-platform.yml, so
      # codex-rs/.config/nextest.toml (serialized test groups, retries, slow
      # timeouts) applies to the fork's tests too.
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      # linux-sandbox's build.rs links libcap through pkg-config. bubblewrap is
      # what the sandbox tests actually run.
      # The rust-heavy runner preinstalls these at boot; jobs there have no sudo.
      - name: Install build libraries
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config libasound2-dev bubblewrap

      # Ubuntu 24.04's AppArmor user-namespace restriction blocks bwrap, so
      # every sandbox test fails without this. Copied from
      # .github/actions/setup-ci/action.yml, which upstream's Linux nextest
      # jobs run before testing.
      # rust-heavy applies these sysctls at boot (/etc/sysctl.d/60-gha-userns.conf).
      - name: Allow unprivileged user namespaces
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # v8's build.rs otherwise downloads librusty_v8 from denoland, which does
      # not publish the ptrcomp_sandbox profile this tree expects. This fetches
      # the Codex-built artifacts from the upstream release and verifies them
      # against the in-tree checksum manifest, the same as fork-release.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      # codex-core's tests overflow the default thread stack (fatal runtime
      # error: stack overflow). Upstream sets the same 8 MiB floor on its
      # test step in rust-ci.yml.
      - name: cargo nextest (app-server integration)
        shell: bash
        env:
          RUST_MIN_STACK: "8388608"
          PACKAGES: ${{ needs.plan.outputs.list }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/fork-ci-nextest.sh" app-server

      # Uploaded even when the job failed: the report is most useful then.
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cargo-timings-test-app-server
          path: /tmp/cargo-timings/
          if-no-files-found: ignore

  # The required check. It passes only when every job above passed, or was
  # skipped because the diff touches no Rust (path scope). It runs on a
  # GitHub-hosted runner: it only reads the other jobs' results.
  result:
    name: fmt, clippy, test
    if: always()
    needs: [plan, lint, test, test-app-server]
    runs-on: ubuntu-24.04
    steps:
      - name: All fork-ci jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")' >/dev/null \
            || { echo "a fork-ci job failed or was cancelled" >&2; exit 1; }
          echo "$RESULTS" | jq -e '.plan.result == "success"' >/dev/null \
            || { echo "plan did not run" >&2; exit 1; }
