# Fork-only CI. The upstream blocking-ci, CLA and v8-canary workflows are
# disabled on this fork, so this is the check that runs on fork pull requests.
# New file with a fork-unique name; no upstream workflow is edited.
name: fork-ci

on:
  pull_request:
    branches: [fork/main]
  workflow_dispatch:
    inputs:
      # Comma-separated package names to check instead of the diff. Used to
      # measure the baseline on unmodified fork/main, which has no diff.
      packages:
        description: Packages to check, overriding the diff
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test
    # Trusted runs (same-repo PRs, workflow_dispatch) use the GCP Spot runner
    # (30 vCPU, persistent sccache; started on demand by the Node B poller).
    # Fork PRs stay on GitHub-hosted runners: a persistent self-hosted runner
    # must never execute untrusted fork code.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","rust-heavy"]') }}
    # The workspace Cargo.toml is codex-rs/Cargo.toml; the repo root has none.
    defaults:
      run:
        working-directory: codex-rs
    env:
      # CI-scoped build settings from the cargo build-performance guide.
      # Job env only: upstream's profiles in Cargo.toml stay untouched.
      # line-tables-only keeps file/line in backtraces (tests do read them)
      # while dropping variable debuginfo, which dominates codegen and linking.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # CI builds once per crate version; incremental caches never pay back.
      CARGO_INCREMENTAL: "0"
      # No RUSTFLAGS. Stable rustc 1.95 on x86_64-unknown-linux-gnu already
      # links with its bundled rust-lld (the self-contained linker, shipped in
      # the sysroot since 1.90). -fuse-ld=lld would need a system lld and a
      # different linker, and nightly-only options (-Zthreads, cranelift) are
      # out: this job pins stable.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # fork/main sits on an upstream release tag, whose release commit bumps
      # the workspace version from 0.0.0 to the tag (Cargo.lock keeps 0.0.0).
      # Upstream runs its tests at 0.0.0 and never on the tag commit, so its
      # snapshots render "v0.0.0" and its daemon tests rely on 0.0.0 counting
      # as a dev build. Test at 0.0.0 the same way. fork-release stamps the
      # real version separately, so releases are unaffected.
      - name: Test at upstream's development version
        run: |
          sed -i '/^\[workspace.package\]$/,/^\[/ s/^version = ".*"$/version = "0.0.0"/' Cargo.toml
          grep -A1 '^\[workspace.package\]$' Cargo.toml | grep -qx 'version = "0.0.0"' \
            || { echo "workspace version reset did not land" >&2; exit 1; }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      # Same pin upstream uses in rust-ci-full-nextest-platform.yml, so
      # codex-rs/.config/nextest.toml (serialized test groups, retries, slow
      # timeouts) applies to the fork's tests too.
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      # linux-sandbox's build.rs links libcap through pkg-config. bubblewrap is
      # what the sandbox tests actually run.
      # The rust-heavy runner preinstalls these at boot; jobs there have no sudo.
      - name: Install build libraries
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config libasound2-dev bubblewrap

      # Ubuntu 24.04's AppArmor user-namespace restriction blocks bwrap, so
      # every sandbox test fails without this. Copied from
      # .github/actions/setup-ci/action.yml, which upstream's Linux nextest
      # jobs run before testing.
      # rust-heavy applies these sysctls at boot (/etc/sysctl.d/60-gha-userns.conf).
      - name: Allow unprivileged user namespaces
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Directory names are not package names (app-server-protocol is the
      # package codex-app-server-protocol) and crates nest (codex-rs/ext/skills),
      # so each changed file maps to the package whose manifest directory is
      # the longest prefix of its path. A workspace manifest change rebuilds
      # every package.
      - name: Packages changed against fork/main
        id: crates
        env:
          FORCED_PACKAGES: ${{ inputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/fork/main 2>/dev/null || git merge-base HEAD fork/main)"
          mapfile -t files < <(git diff --name-only "$base"...HEAD)
          if [[ -n "$FORCED_PACKAGES" ]]; then
            mapfile -t packages < <(echo "$FORCED_PACKAGES" | tr ',' '\n')
            echo "forced: ${packages[*]}"
            {
              echo "list<<EOF"
              printf '%s\n' "${packages[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          all=false
          lock_only=false
          for f in "${files[@]}"; do
            case "$f" in
              codex-rs/Cargo.toml) all=true ;;
              codex-rs/Cargo.lock) lock_only=true ;;
            esac
          done
          # A workspace manifest change rebuilds every package. A Cargo.lock
          # change does not: only members whose resolved dependency set
          # actually moved are selected, by diffing `cargo metadata` (the full
          # resolve, not --no-deps) on the base against HEAD. Any other path
          # still selects its owning package, and a member manifest also
          # selects its workspace reverse-dependencies.
          others=()
          for f in "${files[@]}"; do
            [[ "$f" == "codex-rs/Cargo.lock" ]] && continue
            others+=("$f")
          done
          if $all; then
            mapfile -t packages < <(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].name' | sort -u)
          else
            mapfile -t packages < <(cargo metadata --no-deps --format-version 1 \
              | python3 "${GITHUB_WORKSPACE}/.github/scripts/fork-changed-packages.py" "${others[@]}")
            if $lock_only; then
              base_meta="$(mktemp)"
              head_meta="$(mktemp)"
              cargo metadata --format-version 1 --locked > "$head_meta"
              # metadata reads the lock next to the workspace manifest. Swap the
              # base lock in, read it, and put HEAD's lock back. The manifest
              # stays HEAD's: a manifest change is not lock-only.
              cp Cargo.lock /tmp/Cargo.lock.head
              # A failed metadata read must not leave the base lock checked out:
              # every later cargo invocation would compile against it.
              trap 'mv /tmp/Cargo.lock.head Cargo.lock' EXIT
              git show "$base:codex-rs/Cargo.lock" > Cargo.lock
              cargo metadata --format-version 1 --locked > "$base_meta"
              mv /tmp/Cargo.lock.head Cargo.lock
              trap - EXIT
              mapfile -t locked < <(python3 "${GITHUB_WORKSPACE}/.github/scripts/fork-lock-affected.py" "$base_meta" "$head_meta")
              if (( ${#locked[@]} == 0 )); then
                # A lock that "affects nothing" is a bug in the diff far more
                # often than a fact, and skipping every check would fail open.
                echo "::warning::Cargo.lock changed but the resolve diff selected nothing; selecting every member"
                mapfile -t locked < <(jq -r --argjson members "$(jq -c '.workspace_members' "$head_meta")" \
                  '.packages[] | select(.id as $id | $members | index($id)) | .name' "$head_meta" | sort -u)
              fi
              packages+=("${locked[@]}")
            fi
          fi
          # Unique, stable order.
          mapfile -t packages < <(printf '%s\n' "${packages[@]}" | awk 'NF && !seen[$0]++')
          echo "changed: ${packages[*]:-none}"
          {
            echo "list<<EOF"
            printf '%s\n' "${packages[@]:-}"
            echo "EOF"
            echo "files<<EOF"
            printf '%s\n' "${files[@]:-}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # v8's build.rs otherwise downloads librusty_v8 from denoland, which does
      # not publish the ptrcomp_sandbox profile this tree expects. This fetches
      # the Codex-built artifacts from the upstream release and verifies them
      # against the in-tree checksum manifest, the same as fork-release.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      # codex-voice-host is excluded: it is the only package pulling in GStreamer,
      # and it requires gstreamer-1.0 >= 1.28. Ubuntu 24.04 ships 1.24, so no
      # apt package satisfies it. Upstream never builds it with cargo either; it
      # builds //codex-rs/voice-host with Bazel against a bundled GStreamer.
      - name: cargo check
        run: cargo check --workspace --all-targets --exclude codex-voice-host

      - name: cargo fmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t crates < <(printf '%s\n' "${{ steps.crates.outputs.list }}" | sed '/^$/d')
          (( ${#crates[@]} )) || exit 0
          args=()
          for crate in "${crates[@]}"; do args+=(-p "$crate"); done
          cargo fmt "${args[@]}" -- --check

      # -D warnings would fail the PR on upstream lint debt in files it never
      # touched, and a fork patch must not have to fix that. Clippy runs without
      # it, and only a warning or error whose primary span is in a file this PR
      # changed fails the build. Compile errors are fatal regardless, which
      # `cargo check` above already enforces.
      - name: cargo clippy
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.crates.outputs.files }}" | sed 's|^codex-rs/||' > /tmp/changed-files
          mapfile -t crates < <(printf '%s\n' "${{ steps.crates.outputs.list }}" | sed '/^$/d')
          (( ${#crates[@]} )) || exit 0
          args=()
          for crate in "${crates[@]}"; do args+=(-p "$crate"); done
          # One invocation for every selected package. Per-crate loops re-resolve
          # features and rebuild shared dependencies once per crate; cargo shares
          # that work when the packages are passed together. --timings writes
          # cargo-timing.html, which the next cargo step overwrites, so copy it
          # aside immediately.
          mkdir -p /tmp/cargo-timings
          cargo clippy "${args[@]}" --all-targets --timings --message-format=json -- -W clippy::all \
            > /tmp/clippy.json || true
          [[ -f cargo-timing.html ]] && cp cargo-timing.html /tmp/cargo-timings/clippy-timing.html
          # The gate is by changed file path, so it reads the whole stream once.
          # Splitting per crate first drops every lint from a crate whose
          # package id omits the name (cargo does that when the name equals the
          # directory's last segment: codex-home, codex-api, ...).
          rm -f /tmp/jq-err
          offenders="$(jq -r --slurpfile changed <(jq -R . /tmp/changed-files) '
            select(.reason == "compiler-message")
            | .message
            | select(.level == "warning" or .level == "error")
            | . as $m
            | ($m.spans[] | select(.is_primary)) as $s
            | select(any($changed[]; . == $s.file_name))
            | "\($s.file_name):\($s.line_start):\($s.column_start): \($m.level): \($m.message)"
          ' /tmp/clippy.json 2>/tmp/jq-err)"
          if [[ -s /tmp/jq-err ]]; then
            cat /tmp/jq-err >&2
            echo "jq failed to read the clippy output" >&2
            exit 1
          fi
          if [[ -n "$offenders" ]]; then
            echo "$offenders"
            echo "clippy findings in files this PR changes" >&2
            exit 1
          fi

      - name: cargo test
        shell: bash
        # codex-core's tests overflow the default thread stack (fatal runtime
        # error: stack overflow). Upstream sets the same 8 MiB floor on its
        # test step in rust-ci.yml.
        env:
          RUST_MIN_STACK: "8388608"
        run: |
          set -euo pipefail
          # Tests resolve helper binaries in other packages through
          # cargo_bin(), and `cargo test -p` never builds another package's
          # bins, so CARGO_BIN_EXE_* is unset and the lookup in target/debug
          # misses. Upstream's Bazel build declares them as data deps. Build
          # every workspace bin once first. codex-voice-host is excluded
          # because it needs GStreamer >= 1.28, which Ubuntu 24.04 lacks.
          cargo build --workspace --bins --exclude codex-voice-host
          # nextest UNIONS multiple -E filtersets, so one `not` per line would
          # re-include every excluded test as soon as the file has two lines.
          # Build a single disjunction and omit -E entirely when nothing is
          # listed.
          known=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line#"${line%%[![:space:]]*}"}"
            [[ -z "$line" ]] && continue
            known+=("(${line})")
          done < "${GITHUB_WORKSPACE}/.github/fork-ci-known-failures.txt"
          filter=()
          if (( ${#known[@]} > 0 )); then
            joined="$(printf '%s | ' "${known[@]}")"
            filter=(-E "not (${joined% | })")
          fi
          # A failing crate must not hide the rest: the baseline needs every
          # crate's result, and a PR should see all of its failures at once.
          # nextest is fail-fast by default and cancels a crate's remaining
          # tests at its first failure, so --no-fail-fast does the same within
          # a crate.
          status=0
          mapfile -t crates < <(printf '%s\n' "${{ steps.crates.outputs.list }}" | sed '/^$/d')
          if (( ${#crates[@]} )); then
            args=()
            for crate in "${crates[@]}"; do args+=(-p "$crate"); done
            # One invocation: per-crate loops re-resolved features and rebuilt
            # shared dependencies once per crate. --timings records the
            # critical path next to clippy's.
            cargo nextest run "${args[@]}" --no-fail-fast --timings "${filter[@]}" || status=1
            [[ -f cargo-timing.html ]] && cp cargo-timing.html /tmp/cargo-timings/nextest-timing.html
          fi
          exit "$status"

      # Uploaded even when the job failed: the report is most useful then.
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cargo-timings
          path: /tmp/cargo-timings/
          if-no-files-found: ignore
