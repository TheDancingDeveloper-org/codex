          if-no-files-found: ignore

  # The required check. It passes only when every job above passed, or was
  # skipped because the diff touches no Rust (path scope). It runs on a
  # GitHub-hosted runner: it only reads the other jobs' results.
  result:
    name: fmt, clippy, test
    if: always()
    needs: [plan, lint, test, test-app-server]
    runs-on: ubuntu-24.04
    steps:
      - name: All fork-ci jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")' >/dev/null \
            || { echo "a fork-ci job failed or was cancelled" >&2; exit 1; }
          echo "$RESULTS" | jq -e '.plan.result == "success"' >/dev/null \
            || { echo "plan did not run" >&2; exit 1; }
