# Fork-only CI. The upstream blocking-ci, CLA and v8-canary workflows are
# disabled on this fork, so this is the check that runs on fork pull requests.
# New file with a fork-unique name; no upstream workflow is edited.
name: fork-ci

on:
  pull_request:
    branches: [fork/main]
  # The merge queue (WI-1886, docs/ci.md). The queue tests the tree fork/main
  # will become, so a PR never has to be rebased onto a sibling's merge.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      # Comma-separated package names to check instead of the diff. Used to
      # measure the baseline on unmodified fork/main, which has no diff.
      packages:
        description: Packages to check, overriding the diff
        required: false
        default: ""

permissions:
  contents: read

# A force-push cancels the superseded run. Each queue entry has its own
# gh-readonly-queue/... ref, so queue entries never cancel each other.
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset requires one check, `fmt, clippy, test` (the last job below).
  # The work runs as parallel jobs under other names, and that job reports
  # their combined result, so the required context never changes. Splitting
  # took the merge_group run from 95-105 minutes (one serial job, past the
  # queue's 90-minute timeout) to the length of its longest half, and the
  # selection in `plan` keeps every half to the packages the fork owns
  # (WI-4161).
  plan:
    name: plan
    # Trusted runs (same-repo PRs, workflow_dispatch) use the GCP Spot runner
    # (30 vCPU, persistent sccache; started on demand by the Node B poller).
    # Fork PRs stay on GitHub-hosted runners: a persistent self-hosted runner
    # must never execute untrusted fork code.
    # Temporarily pinned to node-f (WI-4100): ci-k8s-1's 98 GB scratch volume is too small for a Codex workspace build (ENOSPC). Remove the node-f label once the k8s runners have enough scratch.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","rust-heavy","node-f"]') }}
    defaults:
      run:
        working-directory: codex-rs
    outputs:
      rust: ${{ steps.crates.outputs.rust }}
      list: ${{ steps.crates.outputs.list }}
      base: ${{ steps.crates.outputs.base }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # fork/main sits on an upstream release tag, whose release commit bumps
      # the workspace version from 0.0.0 to the tag (Cargo.lock keeps 0.0.0).
      # Upstream runs its tests at 0.0.0 and never on the tag commit, so its
      # snapshots render "v0.0.0" and its daemon tests rely on 0.0.0 counting
      # as a dev build. Test at 0.0.0 the same way. fork-release stamps the
      # real version separately, so releases are unaffected.
      - name: Test at upstream's development version
        run: |
          sed -i '/^\[workspace.package\]$/,/^\[/ s/^version = ".*"$/version = "0.0.0"/' Cargo.toml
          grep -A1 '^\[workspace.package\]$' Cargo.toml | grep -qx 'version = "0.0.0"' \
            || { echo "workspace version reset did not land" >&2; exit 1; }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      # The fork trusts upstream's CI for upstream's code and tests only what
      # the fork owns: the diff against the merge-base with upstream main, the
      # carried patches plus the fork-only files. Diffed against fork/main, an
      # upstream sync is a change to every package, and a run over hundreds of
      # upstream crates took 95-105 minutes (WI-4161). The same base serves PRs
      # and the queue. See fork-ci-select.sh and docs/ci.md, "What the fork
      # tests".
      - name: Packages the fork owns
        id: crates
        env:
          FORCED_PACKAGES: ${{ inputs.packages }}
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/fork-ci-select.sh"

  lint:
    name: fmt, clippy
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","rust-heavy","node-f"]') }}
    # The workspace Cargo.toml is codex-rs/Cargo.toml; the repo root has none.
    defaults:
      run:
        working-directory: codex-rs
    env:
      # CI-scoped build settings from the cargo build-performance guide.
      # Job env only: upstream's profiles in Cargo.toml stay untouched.
      # line-tables-only keeps file/line in backtraces (tests do read them)
      # while dropping variable debuginfo, which dominates codegen and linking.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # CI builds once per crate version; incremental caches never pay back.
      CARGO_INCREMENTAL: "0"
      # No RUSTFLAGS. Stable rustc 1.95 on x86_64-unknown-linux-gnu already
      # links with its bundled rust-lld (the self-contained linker, shipped in
      # the sysroot since 1.90). -fuse-ld=lld would need a system lld and a
      # different linker, and nightly-only options (-Zthreads, cranelift) are
      # out: this job pins stable.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # fork/main sits on an upstream release tag, whose release commit bumps
      # the workspace version from 0.0.0 to the tag (Cargo.lock keeps 0.0.0).
      # Upstream runs its tests at 0.0.0 and never on the tag commit, so its
      # snapshots render "v0.0.0" and its daemon tests rely on 0.0.0 counting
      # as a dev build. Test at 0.0.0 the same way. fork-release stamps the
      # real version separately, so releases are unaffected.
      - name: Test at upstream's development version
        run: |
          sed -i '/^\[workspace.package\]$/,/^\[/ s/^version = ".*"$/version = "0.0.0"/' Cargo.toml
          grep -A1 '^\[workspace.package\]$' Cargo.toml | grep -qx 'version = "0.0.0"' \
            || { echo "workspace version reset did not land" >&2; exit 1; }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      # linux-sandbox's build.rs links libcap through pkg-config. bubblewrap is
      # what the sandbox tests actually run.
      # The rust-heavy runner preinstalls these at boot; jobs there have no sudo.
      - name: Install build libraries
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config libasound2-dev bubblewrap

      # Ubuntu 24.04's AppArmor user-namespace restriction blocks bwrap, so
      # every sandbox test fails without this. Copied from
      # .github/actions/setup-ci/action.yml, which upstream's Linux nextest
      # jobs run before testing.
      # rust-heavy applies these sysctls at boot (/etc/sysctl.d/60-gha-userns.conf).
      - name: Allow unprivileged user namespaces
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # v8's build.rs otherwise downloads librusty_v8 from denoland, which does
      # not publish the ptrcomp_sandbox profile this tree expects. This fetches
      # the Codex-built artifacts from the upstream release and verifies them
      # against the in-tree checksum manifest, the same as fork-release.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      # No whole-workspace `cargo check`: upstream's crates are upstream's to
      # compile and test. clippy below compiles the selected packages with
      # --all-targets and fails on any rustc error (WI-4161). codex-voice-host
      # is never selected: it needs GStreamer >= 1.28 and Ubuntu 24.04 ships
      # 1.24.

      - name: cargo fmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t crates < <(printf '%s\n' "${{ needs.plan.outputs.list }}" | sed '/^$/d')
          (( ${#crates[@]} )) || exit 0
          args=()
          for crate in "${crates[@]}"; do args+=(-p "$crate"); done
          cargo fmt "${args[@]}" -- --check

      # -D warnings would fail the PR on upstream lint debt in lines it never
      # touched, and a fork patch must not have to fix that. Clippy runs without
      # it, and only a warning or error whose primary span overlaps a hunk the
      # fork owns (the diff against the upstream merge-base, carried patches
      # included) fails the build. Compile errors are fatal regardless: this
      # step fails on any rustc error.
      - name: cargo clippy
        shell: bash
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          base="$BASE"
          # One changed line range per hunk, as "file start count" with the
          # codex-rs/ prefix stripped. A count of 0 is a pure deletion.
          git diff -U0 "$base"...HEAD -- codex-rs \
            | awk '/^diff --git/{file=$4; sub(/^b\/codex-rs\//, "", file)}
                   /^@@/{split($3,a,","); sub(/^\+/, "", a[1]); print file, a[1], (a[2] == "" ? 1 : a[2])}' \
            > /tmp/changed-lines
          mapfile -t crates < <(printf '%s\n' "${{ needs.plan.outputs.list }}" | sed '/^$/d')
          (( ${#crates[@]} )) || exit 0
          args=()
          for crate in "${crates[@]}"; do args+=(-p "$crate"); done
          # One invocation for every selected package. Per-crate loops re-resolve
          # features and rebuild shared dependencies once per crate; cargo shares
          # that work when the packages are passed together. --timings writes
          # cargo-timing.html, which the next cargo step overwrites, so copy it
          # aside immediately.
          mkdir -p /tmp/cargo-timings
          clippy_status=0
          # Width from the runner's cores and memory limit: a whole-workspace
          # --all-targets clippy at full width was OOMKilled at an 11 GiB limit
          # (WI-3954). See fork-ci-build-jobs.sh.
          jobs="$("${GITHUB_WORKSPACE}/.github/scripts/fork-ci-build-jobs.sh")"
          cargo clippy "${args[@]}" --all-targets --jobs "$jobs" --timings --message-format=json -- -W clippy::all \
            > /tmp/clippy.json || clippy_status=$?
          [[ -f cargo-timing.html ]] && cp cargo-timing.html /tmp/cargo-timings/clippy-timing.html
          # Compile errors are fatal anywhere. Only clippy's own lints are gated
          # by changed hunk.
          rustc_errors="$(jq -r '
            select(.reason == "compiler-message")
            | .message
            | select(.level == "error")
            | select(((.code.code // "") | startswith("clippy::")) | not)
            | .rendered' /tmp/clippy.json)"
          if [[ -n "$rustc_errors" ]]; then
            echo "$rustc_errors"
            echo "compile errors" >&2
            exit 1
          fi
          # A failed build with no error diagnostic at all (a build script or
          # the linker failed) is fatal too; a failure that is only clippy's
          # own deny-level lints falls through to the hunk gate below.
          if (( clippy_status != 0 )) && ! jq -e 'select(.reason == "compiler-message" and .message.level == "error")' /tmp/clippy.json >/dev/null; then
            echo "cargo clippy failed (exit $clippy_status) without a compiler diagnostic" >&2
            exit 1
          fi
          # The gate is by changed hunk, so it reads the whole stream once.
          # Splitting per crate first drops every lint from a crate whose
          # package id omits the name (cargo does that when the name equals the
          # directory's last segment: codex-home, codex-api, ...).
          rm -f /tmp/jq-err
          offenders="$(jq -r --slurpfile lines <(jq -R 'split(" ") | {file:.[0], start:.[1]|tonumber, count:.[2]|tonumber}' /tmp/changed-lines) '
            select(.reason == "compiler-message")
            | .message
            | select(.level == "warning" or .level == "error")
            | . as $m
            | ($m.spans[] | select(.is_primary)) as $s
            | select(any($lines[];
                .file == $s.file_name
                and .count > 0
                and $s.line_start <= (.start + .count - 1)
                and $s.line_end >= .start))
            | "\($s.file_name):\($s.line_start):\($s.column_start): \($m.level): \($m.message)"
          ' /tmp/clippy.json 2>/tmp/jq-err)"
          if [[ -s /tmp/jq-err ]]; then
            cat /tmp/jq-err >&2
            echo "jq failed to read the clippy output" >&2
            exit 1
          fi
          if [[ -n "$offenders" ]]; then
            echo "$offenders"
            echo "clippy findings in lines this PR changes" >&2
            exit 1
          fi

      # Uploaded even when the job failed: the report is most useful then.
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cargo-timings-lint
          path: /tmp/cargo-timings/
          if-no-files-found: ignore

  test:
    name: test
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    # Both heavy halves are pinned to node-f (operator, 2026-11-13, WI-4161).
    # This half runs on [self-hosted, bigmem, node-f], which matches only
    # nodef-gha-public-rust (24 GiB). codex-core's `all` test binary was
    # OOM-killed on the 10 GiB nodef-gha-public-docker even at two jobs
    # (run 43317835444), so this half must not land there.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON('["self-hosted","bigmem","node-f"]') }}
