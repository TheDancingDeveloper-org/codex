# Fork-only drift check (WI-1125). Fails when a newer upstream stable tag has
# shipped than the one recorded in FORK.md and stamped in fork-release.yml, or
# when the carried-patch table grows past its cap. It reports drift; it does
# not rebase. New file with a fork-unique name; no upstream workflow is edited.
name: fork-upstream-drift

on:
  schedule:
    # Weekly, Monday 06:00 UTC. A new stable tag between runs is caught here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: upstream tag and carried-patch cap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check upstream drift
        env:
          UPSTREAM_REMOTE: https://github.com/openai/codex.git
        run: bash .github/scripts/fork-upstream-drift.sh
